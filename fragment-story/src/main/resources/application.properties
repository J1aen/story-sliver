spring.application.name=fragment-story
server.port=8080

# MySQL 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/story_sliver?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# 下划线字段自动转驼峰
mybatis.configuration.map-underscore-to-camel-case=true
# Mapper XML 位置（与包路径一致，Task 2 会把 XML 移到该目录）
mybatis.mapper-locations=classpath:com/storysliver/mapper/*.xml

# JWT 签名密钥：生产环境必须改为随机长字符串（>=32 字节）
app.jwt.secret=change-me-to-a-long-random-secret-at-least-32-bytes-long
# token 有效期（天），到期需重新登录
app.jwt.expire-days=30
# 初始管理员注册密码：启动时加密写入 system_config，站长可随时在管理页修改
app.admin.default-register-code=StoryAdmin2026

# 头像上传：保存目录（用户电脑本地）与大小限制
app.upload.avatar-dir=D:/HeadImage
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
