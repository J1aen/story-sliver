spring.application.name=fragment-story
server.port=8080

# MySQL 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/story_sliver?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# 下划线字段自动转驼峰
mybatis.configuration.map-underscore-to-camel-case=true
# Mapper XML 位置（与包路径一致，Task 2 会把 XML 移到该目录）
mybatis.mapper-locations=classpath:com/storysliver/mapper/*.xml

# JWT 签名密钥：生产环境必须改为随机长字符串（>=32 字节）
app.jwt.secret=change-me-to-a-long-random-secret-at-least-32-bytes-long
# token 有效期（天），到期需重新登录
app.jwt.expire-days=30
# 初始管理员注册密码（默认值仅用于本地开发）：启动时加密写入 system_config，站长注册后应立刻在管理页修改
app.admin.default-register-code=change-me-admin-code

# 头像上传：保存目录（用户电脑本地）与大小限制
app.upload.avatar-dir=D:/HeadImage

# 上传大小限制：头像 2MB、公告图片 5MB，统一放宽到 6MB（原来的 2MB 配置已合并到这里，不能重复声明，
# 否则 Spring 取最后一个值，公告图超 2MB 会直接 500）
# 为什么必须配：Spring 默认 multipart 上限只有 1MB，超过会在进 Controller 前被拒并返回 500，
# 配大后由代码里的业务校验接管，超限走 GlobalExceptionHandler 返回 400 友好提示
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat 拒绝超限请求后要「吞掉」剩余请求体才能正常返回错误响应；默认只吞 8MB，
# 超大文件（如 12MB+）吞不下会直接断开连接，前端只看到网络错误。放宽到 15MB 让超限统一返回友好提示
server.tomcat.max-swallow-size=15MB
